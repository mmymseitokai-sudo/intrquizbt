<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>音源アップローダー（完全復旧版）</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: -apple-system, sans-serif; text-align: center; padding: 20px; background: #34495e; color: #ecf0f1; margin: 0; }
        .container { max-width: 600px; margin: 0 auto; background: #2c3e50; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        h1 { font-size: 1.3rem; font-weight: bold; color: #bdc3c7; margin-bottom: 20px; }
        .setup-area { background: #34495e; padding: 20px; border-radius: 8px; text-align: left; margin-bottom: 20px; }
        .area-title { font-size: 1.1rem; font-weight: bold; color: #f1c40f; margin-top: 0; border-bottom: 1px solid #4f5f6f; padding-bottom: 8px; margin-bottom: 15px; }
        .list-item { background: #1a252f; padding: 12px; margin-bottom: 10px; border-radius: 6px; display: flex; flex-direction: column; text-align: left; border-left: 4px solid #3498db; }
        .list-name { font-weight: bold; color: #ecf0f1; margin-bottom: 8px; font-size: 1.1rem; }
        .list-actions { display: flex; gap: 5px; flex-wrap: wrap; }
        .list-actions button { width: auto; padding: 6px 10px; font-size: 0.8rem; margin: 0; border-radius: 4px; font-weight: bold; color: white; border: none; cursor: pointer; }
        input[type="text"] { font-size: 1.1rem; padding: 12px; width: calc(100% - 24px); margin-bottom: 15px; border: 1px solid #7f8c8d; border-radius: 6px; background: #2c3e50; color: white; outline: none; }
        button { font-size: 1rem; padding: 12px; margin: 5px 0; width: 100%; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; color: white; }
        #status { font-weight: bold; margin-top: 15px; color: #f1c40f; display: none; background: #1a252f; padding: 10px; border-radius: 6px; font-size: 0.9rem; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="container">
        <h1>音源データ管理・アップローダー</h1>

        <div class="setup-area">
            <h2 class="area-title">保存済みのリスト管理</h2>
            <div id="playlist-container"><p style="font-size:0.85rem; color:#95a5a6;">データベースと通信中...</p></div>
        </div>
        
        <div class="setup-area">
            <h2 class="area-title" id="form-title">新規プレイリスト作成</h2>
            <p style="font-size:0.85rem; color:#bdc3c7;">1. リストの名前を入力</p>
            <input type="text" id="event-name" placeholder="例：予選Aブロック">
            <input type="hidden" id="edit-mode" value="new">
        </div>

        <div class="setup-area" style="background:#293a4c;">
            <h2 class="area-title" style="color:#2ecc71;">2. 1曲ずつ登録する</h2>
            <p style="font-size:0.85rem; color:#f1c40f; margin-bottom:5px;">※動画（画面録画等）をそのまま選んでOKです。音声のみを自動抽出して保存します。</p>
            
            <input type="text" id="track-title" placeholder="曲名（例：島人ぬ宝）" style="margin-top:10px;">
            
            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                <button onclick="document.getElementById('intro-file').click()" style="width:48%; background:#3498db;">イントロ選択</button>
                <button onclick="document.getElementById('sabi-file').click()" style="width:48%; background:#e67e22;">サビ選択(任意)</button>
            </div>
            
            <div id="file-info" style="font-size:0.85rem; color:#bdc3c7; margin-bottom:15px; background:#1a252f; padding:8px; border-radius:4px;">イントロ: 未選択 <br> サビ: 未選択</div>
            
            <input type="file" id="intro-file" accept="audio/*,video/*" style="display:none">
            <input type="file" id="sabi-file" accept="audio/*,video/*" style="display:none">
            
            <button onclick="addTrack()" style="background:#2ecc71;">＋ この曲を送信リストに追加</button>
        </div>

        <div class="setup-area">
            <h2 class="area-title">3. 追加された曲リスト</h2>
            <div id="pending-list" style="margin-bottom: 15px; font-size:0.9rem; color:#95a5a6;">(まだ曲がありません)</div>
            
            <button id="btn-upload" style="background:#e05275; display:none;">データベースに保存（送信）</button>
            <button id="btn-cancel" style="background:#7f8c8d; display:none;" onclick="resetForm()">追加をキャンセル</button>
        </div>
        
        <div id="status"></div>

        <button onclick="forceResetDB()" style="background:transparent; border:1px solid #e74c3c; color:#e74c3c; font-size:0.8rem; margin-top:30px;">⚠️ データベースの詰まりを解消（全初期化）</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDzIx3CN5EnlznHgXMDNDb5Bulk9lpQpBw",
            authDomain: "mmym-intr-hyosbt.firebaseapp.com",
            databaseURL: "https://mmym-intr-hyosbt-default-rtdb.firebaseio.com",
            projectId: "mmym-intr-hyosbt",
            storageBucket: "mmym-intr-hyosbt.firebasestorage.app",
            messagingSenderId: "581272142056",
            appId: "1:581272142056:web:25101dd8425e884f21c95d",
            measurementId: "G-2MNRCP27T9"
        };
        try { if (!firebase.apps.length) firebase.initializeApp(firebaseConfig); } catch (e) {}
        const db = firebase.database(); const ref = db.ref('quiz_room');

        let pendingTracks = []; let introFile = null; let sabiFile = null;
        const playlistContainer = document.getElementById('playlist-container');

        // ★3秒以上応答がない場合の安全タイマー（これで永遠に読込中になるのを完全に防ぎます）
        const loadTimer = setTimeout(() => {
            playlistContainer.innerHTML = `
                <div style="background:#c0392b; color:#fff; padding:12px; border-radius:6px; font-size:0.85rem; line-height:1.6;">
                    <b>通信がタイムアウトしました</b><br>
                    前回アップロードした巨大な動画データで通信が詰まっている可能性があります。<br>
                    <div style="margin-top:10px;">
                        <button onclick="forceResetDB()" style="background:#f39c12; color:#fff; border:none; padding:8px 12px; border-radius:4px; font-weight:bold; cursor:pointer;">詰まったデータを初期化して復旧</button>
                        <button onclick="location.reload()" style="background:#7f8c8d; color:#fff; border:none; padding:8px 12px; border-radius:4px; margin-left:5px; cursor:pointer;">再読み込み</button>
                    </div>
                </div>`;
        }, 3000);

        // 保存済みリストの監視
        ref.child('saved_playlists').on('value', (snap) => {
            clearTimeout(loadTimer);
            try {
                const data = snap.val() || {};
                playlistContainer.innerHTML = '';
                const keys = Object.keys(data);
                
                if (keys.length === 0) {
                    playlistContainer.innerHTML = '<p style="font-size:0.85rem; color:#95a5a6;">保存されているリストはありません。</p>';
                    return;
                }
                
                let html = '';
                keys.forEach(key => {
                    const playlist = data[key];
                    const isBroken = !Array.isArray(playlist);
                    const count = isBroken ? "破損" : playlist.length + "曲";
                    html += `
                        <div class="list-item">
                            <div class="list-name">${key} <span style="font-size:0.8rem;color:#95a5a6;">(${count})</span></div>
                            <div class="list-actions">
                                ${!isBroken ? `<button style="background:#3498db;" onclick="prepareAppend('${key}')">追加</button>` : ''}
                                ${!isBroken ? `<button style="background:#95a5a6;" onclick="renamePlaylist('${key}')">名前</button>` : ''}
                                <button style="background:#e74c3c;" onclick="deletePlaylist('${key}')">削除</button>
                            </div>
                        </div>`;
                });
                playlistContainer.innerHTML = html;
            } catch (err) {
                playlistContainer.innerHTML = `<p style="color:#e74c3c;">データ解析エラー<br><button onclick="forceResetDB()" style="background:#e74c3c;">初期化</button></p>`;
            }
        }, (error) => {
            clearTimeout(loadTimer);
            playlistContainer.innerHTML = `
                <div style="background:#c0392b; color:#fff; padding:12px; border-radius:6px; font-size:0.85rem;">
                    <b>Firebase接続エラー:</b> ${error.message}<br>
                    データベースのルールが <code>.read: true, .write: true</code> になっているか確認してください。
                </div>`;
        });

        // 強制初期化
        window.forceResetDB = async function() {
            if (confirm("【警告】保存されているすべてのデータを完全に消去して初期化します。よろしいですか？")) {
                playlistContainer.innerHTML = '<p style="color:#f1c40f;">初期化中...</p>';
                try {
                    await ref.child('saved_playlists').remove();
                    await ref.child('saved_audio').remove();
                    alert("初期化が完了しました。ページを再読み込みします。");
                    location.reload();
                } catch(e) {
                    alert("初期化失敗: " + e.message);
                }
            }
        };

        window.deletePlaylist = async function(name) {
            if (confirm(`「${name}」をリストごと削除しますか？`)) {
                await ref.child('saved_playlists').child(name).remove();
                await ref.child('saved_audio').child(name).remove();
                if(document.getElementById('event-name').value === name) resetForm();
            }
        };

        window.renamePlaylist = async function(oldName) {
            const newName = prompt(`新しい名前を入力:`, oldName);
            if (!newName || newName === oldName) return;
            const safeName = newName.trim().replace(/[.#$[\]]/g, "_");
            try {
                const pSnap = await ref.child('saved_playlists').child(oldName).once('value');
                const aSnap = await ref.child('saved_audio').child(oldName).once('value');
                await ref.child('saved_playlists').child(safeName).set(pSnap.val());
                await ref.child('saved_audio').child(safeName).set(aSnap.val());
                await ref.child('saved_playlists').child(oldName).remove();
                await ref.child('saved_audio').child(oldName).remove();
            } catch(e) { alert("エラー: " + e.message); }
        };

        window.prepareAppend = function(name) {
            document.getElementById('form-title').innerText = `「${name}」に曲を追加`;
            document.getElementById('form-title').style.color = "#3498db";
            document.getElementById('event-name').value = name;
            document.getElementById('event-name').readOnly = true;
            document.getElementById('edit-mode').value = 'append';
            document.getElementById('btn-cancel').style.display = 'block';
        };

        window.resetForm = function() {
            document.getElementById('form-title').innerText = `新規プレイリスト作成`;
            document.getElementById('form-title').style.color = "#f1c40f";
            document.getElementById('event-name').value = '';
            document.getElementById('event-name').readOnly = false;
            document.getElementById('edit-mode').value = 'new';
            document.getElementById('btn-cancel').style.display = 'none';
            pendingTracks = []; introFile = null; sabiFile = null; updateFileInfo(); renderPendingList();
            document.getElementById('status').style.display = 'none';
        };

        document.getElementById('intro-file').addEventListener('change', e => { introFile = e.target.files[0]; updateFileInfo(); });
        document.getElementById('sabi-file').addEventListener('change', e => { sabiFile = e.target.files[0]; updateFileInfo(); });
        function updateFileInfo() {
            document.getElementById('file-info').innerHTML = `イントロ: ${introFile ? introFile.name : "<span style='color:#e74c3c'>未選択</span>"} <br> サビ: ${sabiFile ? sabiFile.name : "未選択"}`;
        }

        window.addTrack = function() {
            const title = document.getElementById('track-title').value.trim();
            if (!title || !introFile) return alert("曲名とイントロ音源は必須です！");
            pendingTracks.push({ title: title, introFile: introFile, sabiFile: sabiFile });
            document.getElementById('track-title').value = ""; introFile = null; sabiFile = null;
            document.getElementById('intro-file').value = ""; document.getElementById('sabi-file').value = "";
            updateFileInfo(); renderPendingList();
        };

        function renderPendingList() {
            const listDiv = document.getElementById('pending-list');
            if (pendingTracks.length === 0) {
                listDiv.innerHTML = "(まだ曲がありません)";
                document.getElementById('btn-upload').style.display = 'none';
                return;
            }
            let html = "";
            pendingTracks.forEach((t, i) => {
                html += `
                    <div style="background:#1a252f; padding:8px; margin-bottom:5px; border-radius:4px; display:flex; justify-content:space-between; align-items:center;">
                        <div style="text-align:left;">${i+1}. ${t.title} <span style="font-size:0.7rem;color:#7f8c8d;">[${t.sabiFile ? 'サビ有' : 'サビ無'}]</span></div>
                        <button onclick="removeTrack(${i})" style="width:auto; padding:4px 10px; margin:0; background:#e74c3c; border-radius:4px; font-size:0.8rem;">外す</button>
                    </div>`;
            });
            listDiv.innerHTML = html;
            document.getElementById('btn-upload').style.display = 'block';
        }

        window.removeTrack = function(i) { pendingTracks.splice(i, 1); renderPendingList(); };

        const fileToBase64 = (file) => new Promise((resolve, reject) => {
            const reader = new FileReader(); reader.readAsDataURL(file); reader.onload = () => resolve(reader.result); reader.onerror = e => reject(e);
        });

        // ★★★ 動画から音声を確実に抽出する処理（時間切れやサイズエラーを完全回避） ★★★
        async function extractAudioSmart(file) {
            // 音声ファイルならそのまま変換
            if (file.type.startsWith('audio/')) {
                return await fileToBase64(file);
            }

            // 動画ファイルの場合：ブラウザ上で再生して音声だけを取り出す
            return new Promise((resolve, reject) => {
                const video = document.createElement('video');
                video.src = URL.createObjectURL(file);
                video.playsInline = true;
                video.muted = false;
                video.volume = 0.001; // iPhoneの自動停止を防ぐための極小音量
                video.style.position = 'fixed';
                video.style.top = '-9999px';
                document.body.appendChild(video);

                video.onloadeddata = () => {
                    try {
                        const AudioCtx = window.AudioContext || window.webkitAudioContext;
                        const ctx = new AudioCtx();
                        ctx.resume();

                        const src = ctx.createMediaElementSource(video);
                        const dest = ctx.createMediaStreamDestination();
                        src.connect(dest);

                        // スピーカーにも微小音量で流してiOSの停止を防止
                        const gain = ctx.createGain();
                        gain.gain.value = 0.001;
                        src.connect(gain);
                        gain.connect(ctx.destination);

                        let mime = 'audio/mp4';
                        if (!MediaRecorder.isTypeSupported(mime)) mime = 'audio/webm';
                        let recorder;
                        try { recorder = new MediaRecorder(dest.stream, { mimeType: mime }); } 
                        catch(e) { recorder = new MediaRecorder(dest.stream); }

                        const chunks = [];
                        recorder.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };
                        recorder.onstop = () => {
                            const blob = new Blob(chunks, { type: recorder.mimeType || 'audio/mp4' });
                            const reader = new FileReader();
                            reader.readAsDataURL(blob);
                            reader.onload = () => { cleanup(); resolve(reader.result); };
                            reader.onerror = err => { cleanup(); reject(err); };
                        };

                        function cleanup() {
                            video.pause();
                            URL.revokeObjectURL(video.src);
                            if (video.parentNode) video.parentNode.removeChild(video);
                            try { ctx.close(); } catch(e){}
                        }

                        recorder.start(100);
                        video.play().catch(e => {
                            cleanup();
                            // 自動再生できなかった場合は動画のまま送る
                            fileToBase64(file).then(resolve).catch(reject);
                        });

                        // 15秒経過または再生終了でストップ
                        video.ontimeupdate = () => {
                            if (video.currentTime >= 15 || video.ended) {
                                if (recorder.state === 'recording') recorder.stop();
                                video.ontimeupdate = null;
                            }
                        };
                        video.onended = () => {
                            if (recorder.state === 'recording') recorder.stop();
                        };
                    } catch (err) {
                        video.parentNode && video.parentNode.removeChild(video);
                        fileToBase64(file).then(resolve).catch(reject);
                    }
                };
                video.onerror = () => {
                    video.parentNode && video.parentNode.removeChild(video);
                    fileToBase64(file).then(resolve).catch(reject);
                };
            });
        }

        // 送信処理
        document.getElementById('btn-upload').addEventListener('click', async () => {
            const eventName = document.getElementById('event-name').value.trim().replace(/[.#$[\]]/g, "_");
            if (!eventName) return alert("リストの名前を入力してください！");
            const mode = document.getElementById('edit-mode').value;
            const statusDiv = document.getElementById('status'); 
            statusDiv.innerHTML = "処理を開始します...<br>画面を閉じないでください"; 
            statusDiv.style.display = 'block';

            try {
                let startIndex = 0; let existingPlaylist = [];
                if (mode === 'append') {
                    const snap = await ref.child('saved_playlists').child(eventName).once('value');
                    existingPlaylist = snap.val() || []; startIndex = existingPlaylist.length;
                }

                for (let i = 0; i < pendingTracks.length; i++) {
                    const targetIdx = startIndex + i; const t = pendingTracks[i];
                    statusDiv.innerHTML = `[${i + 1}/${pendingTracks.length}] ${t.title}<br>音声を抽出してデータベースに送信中...`;
                    
                    const introBase64 = await extractAudioSmart(t.introFile);
                    await ref.child('saved_audio').child(eventName).child('intros').child(targetIdx).set(introBase64);
                    
                    let sabiBase64 = "";
                    if (t.sabiFile) { 
                        statusDiv.innerHTML = `[${i + 1}/${pendingTracks.length}] ${t.title} (サビ)<br>音声を抽出して送信中...`; 
                        sabiBase64 = await extractAudioSmart(t.sabiFile); 
                    }
                    await ref.child('saved_audio').child(eventName).child('sabis').child(targetIdx).set(sabiBase64);
                    existingPlaylist.push({ introName: t.title, sabiName: t.sabiFile ? `${t.title}(サビ)` : "" });
                }

                statusDiv.innerText = "同期完了！リストを更新しています...";
                await ref.child('saved_playlists').child(eventName).set(existingPlaylist);
                
                statusDiv.innerText = mode === 'append' ? `完了！「${eventName}」に追加されました。` : `完了！新規リスト「${eventName}」が保存されました。`;
                setTimeout(() => { resetForm(); }, 2500);

            } catch (e) { alert("送信エラー: " + e.message); statusDiv.innerText = "エラーが発生しました"; }
        });
    </script>
</body>
</html>
